<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>orgchat launch video</title>
<style>
  :root {
    --bg: #07090d; --ink: #f2f3ef; --muted: #8b909b; --line: #232833;
    --mint: #6ee7b7; --mint-2: #34d399; --violet: #a78bfa; --red: #fb7185; --card: #10141b; --card-2: #151a23;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }

  /* background */
  #bg { position: absolute; inset: -200px; }
  #grid { position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .55; }
  #glow1 { width: 900px; height: 700px; background: #0f766e; }
  #glow2 { width: 800px; height: 700px; background: #5b21b6; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }

  /* type */
  .eyebrow { font: 600 22px/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .14em; color: var(--mint); text-transform: uppercase; }
  .headline { font-weight: 750; font-size: 68px; line-height: 1.04; letter-spacing: -.025em; }
  .word { display: inline-block; white-space: pre; will-change: transform, opacity; }
  .hl { color: var(--mint); }
  .bad { color: var(--red); }

  /* chips */
  .chip { position: absolute; padding: 16px 28px; border-radius: 999px; background: var(--card-2); border: 1.5px solid #2b3240;
    font-size: 30px; font-weight: 600; white-space: nowrap; transform: translate(-50%, -50%); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .chip .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 12px; vertical-align: 3px; }
  #core { position: absolute; transform: translate(-50%, -50%); padding: 26px 46px; border-radius: 28px; font-size: 46px; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(135deg, #0f2a24, #1b1640); border: 2px solid rgba(110,231,183,.6); box-shadow: 0 0 80px rgba(110,231,183,.35), 0 20px 60px rgba(0,0,0,.6); }

  /* windows */
  .win { position: absolute; border-radius: 16px; background: #0b0d11; border: 1px solid #262c36; overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.03) inset; }
  .win .bar { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #12161d; border-bottom: 1px solid #1f242d; }
  .win .bar i { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  .win .bar .t { margin-left: 18px; font: 500 17px/1 "SF Mono", Menlo, monospace; color: #8b909b; display: flex; gap: 14px; }
  .win .bar .pill { padding: 6px 12px; border-radius: 8px; background: #1a1f28; color: #cfd3da; }
  .win .bar .url { flex: 1; margin: 0 120px; height: 28px; border-radius: 8px; background: #0b0d11; border: 1px solid #232833; display: grid; place-items: center; font: 500 15px/1 "SF Mono", Menlo, monospace; color: #8b909b; }
  .win .body { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; background: #000; }
  .win .body img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .ring { position: absolute; border: 3px solid var(--mint); border-radius: 12px; box-shadow: 0 0 0 6px rgba(110,231,183,.15), 0 0 40px rgba(110,231,183,.45); pointer-events: none; }
  .callout { position: absolute; padding: 12px 20px; border-radius: 12px; background: var(--mint); color: #04130d; font-weight: 700; font-size: 26px; white-space: nowrap; box-shadow: 0 16px 50px rgba(0,0,0,.5); }

  /* crypto scene */
  .node { position: absolute; transform: translate(-50%, -50%); width: 400px; padding: 30px 32px; border-radius: 22px; background: var(--card); border: 1.5px solid #262c36; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .node .n1 { font: 700 34px/1.1 -apple-system, sans-serif; letter-spacing: -.01em; }
  .node .n2 { margin-top: 12px; font: 500 20px/1 "SF Mono", Menlo, monospace; color: var(--muted); }
  .node.relay { width: 330px; text-align: center; background: linear-gradient(180deg, #121722, #0d1118); }
  .srv { width: 120px; margin: 0 auto 18px; display: grid; gap: 8px; }
  .srv b { display: block; height: 22px; border-radius: 6px; background: #1d2430; border: 1px solid #2c3442; position: relative; }
  .srv b::after { content: ""; position: absolute; right: 10px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px var(--mint); }
  .bubble { position: absolute; transform: translate(-50%, -50%); padding: 22px 30px; border-radius: 22px; font-size: 32px; font-weight: 600; white-space: nowrap; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  .bubble.plain { background: #f2f3ef; color: #0b0d11; }
  .bubble.cipher { background: #1a1230; color: #c4b5fd; border: 1.5px solid #6d28d9; font-family: "SF Mono", Menlo, monospace; font-weight: 500; }
  .stored { position: absolute; transform: translateX(-50%); font: 500 20px/1.4 "SF Mono", Menlo, monospace; color: #c4b5fd; text-align: center; white-space: nowrap; }
  .foot { position: absolute; left: 0; right: 0; text-align: center; font: 500 24px/1 "SF Mono", Menlo, monospace; color: var(--muted); letter-spacing: .02em; }
  .dash { position: absolute; height: 2px; background-image: linear-gradient(90deg, #2d3441 50%, transparent 50%); background-size: 16px 2px; }

  /* any agent scene */
  .code { position: absolute; border-radius: 20px; background: #0d1016; border: 1px solid #262c36; padding: 34px 40px; font: 500 30px/1.6 "SF Mono", Menlo, monospace; white-space: pre; box-shadow: 0 30px 90px rgba(0,0,0,.55); }
  .code .k { color: #93c5fd; } .code .s { color: #6ee7b7; } .code .p { color: #8b909b; }
  .cursor { display: inline-block; width: 14px; height: 1.1em; background: var(--mint); vertical-align: -4px; margin-left: 2px; }
  .agent { position: absolute; padding: 12px 20px; border-radius: 12px; border: 1.5px solid #2b3240; background: #10141b; font-size: 24px; font-weight: 600; color: #6b7280; white-space: nowrap; }
  .agent.on { color: var(--ink); border-color: rgba(110,231,183,.7); background: #0f1f1a; box-shadow: 0 0 30px rgba(110,231,183,.18); }
  .chat { position: absolute; border-radius: 22px; background: #0f1218; border: 1px solid #262c36; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,.55); }
  .chat .hd { height: 70px; display: flex; align-items: center; gap: 14px; padding: 0 26px; border-bottom: 1px solid #1f242d; font-size: 24px; font-weight: 700; }
  .chat .hd .av { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #34d399, #7c3aed); }
  .chat .hd small { margin-left: auto; font: 500 17px/1 "SF Mono", Menlo, monospace; color: var(--muted); }
  .msg { position: absolute; max-width: 560px; padding: 18px 22px; border-radius: 18px; font-size: 25px; line-height: 1.35; }
  .msg.bot { left: 26px; background: #1a1f28; border-top-left-radius: 6px; }
  .msg.me { right: 26px; background: #0f3a2c; color: #d1fae5; border-top-right-radius: 6px; }
  .msg .meta { display: block; font: 600 17px/1.2 "SF Mono", Menlo, monospace; color: var(--muted); margin-bottom: 8px; }

  /* cta */
  .term { position: absolute; transform: translateX(-50%); padding: 28px 44px; border-radius: 18px; background: #0d1016; border: 1.5px solid #2b3240; font: 600 46px/1 "SF Mono", Menlo, monospace; white-space: pre; box-shadow: 0 0 0 1px rgba(110,231,183,.1), 0 30px 90px rgba(0,0,0,.6); }
  .term .p { color: var(--mint); }
  .tag { position: absolute; transform: translateX(-50%); display: flex; gap: 14px; white-space: nowrap; }
  .tag span { padding: 12px 22px; border-radius: 999px; background: #10141b; border: 1.5px solid #2b3240; font-size: 24px; font-weight: 600; color: #cfd3da; }
  .wordmark { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 30px; font-weight: 800; letter-spacing: -.045em; }
  .wordmark .txt { background: linear-gradient(100deg, #ffffff 30%, #6ee7b7 70%, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="glow" id="glow1"></div><div class="glow" id="glow2"></div></div>
  <div id="grid"></div>
  <div id="scenes"></div>
  <div id="vignette"></div>
  <div id="fade" class="abs" style="inset:0;background:#000;opacity:0"></div>
</div>
<script type="module" src="./scenes.js"></script>
</body>
</html>
